# Production override for a single-server install (see deploy/README.md).
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#       --env-file deploy/prod.env --profile prod up -d --build
# Differences from the dev stack:
#   * no host ports for db / redis / api: only the proxy (80/443) is published;
#   * the code is baked into the images (no source bind mounts, no dump mount);
#   * the Postgres password comes from deploy/prod.env, and Postgres gets more memory
#     (sized for the Alitqan server 10.10.10.150: 6 CPU, 8 GB RAM).
# Paths here are relative to the project directory (the first -f file's directory).
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/prod.env}
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=150
      - -c
      - jit=off
    # Published only for the PBX's realtime SIP-auth lookup (view pbx_ps_auths, role
    # cawp_pbx_realtime, TLS). pg_hba.conf in the volume admits that role from the PBX IP only
    # and refuses every other remote client. Default: loopback (not reachable from the LAN).
    ports: !override
      - "${CAWP_DB_PUBLISH:-127.0.0.1:5432}:5432"
    volumes: !override
      - cawp_pgdata:/var/lib/postgresql/data
      - ./db:/db:ro

  redis:
    ports: !reset []

  api:
    ports: !reset []
    volumes: !override
      - cawp_uploads:/app/uploads
      - ./db:/db:ro

  worker:
    volumes: !override
      - cawp_uploads:/app/uploads

  # Calling service against the real Issabel (docs/issabel-commissioning.md). Values come from
  # deploy/prod.env (CALLING_*); it stays refused until CALLING_PBX_COMMISSIONED=1.
  calling:
    profiles: !override ["prod"]
    restart: unless-stopped
    environment:
      CALLING_AMI_CA_FILE: ""                                  # the PBX uses a public certificate
      CALLING_AMI_SERVER_NAME: ${CALLING_AMI_SERVER_NAME:-}    # name in that certificate
      CALLING_CDR_CSV: ""
    ports:
      # FastAGI hook: the PBX connects here (CALLING_AGI_ALLOWED_PEERS + the shared key decide).
      - "${CAWP_AGI_PUBLISH:-127.0.0.1:4573}:4573"
    volumes: !reset []
