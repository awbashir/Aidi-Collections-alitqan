# CAWP production site: TLS termination, the built SPA, and /api -> api:9797 (prefix stripped).
# Certificates are mounted from deploy/certs (never committed): fullchain.pem + privkey.pem.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Alitqan: reached by IP (https://10.10.10.150) with a self-signed certificate for now.
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Excel imports and documents (the API caps uploads at MAX_UPLOAD_MB, default 50).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's resolver + a variable: nginx starts even if the api container is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cawp_api http://api:9797;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $cawp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # streamed exports and long reports (DEPLOY.md "Operational notes")
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # In-app softphone signalling: the browser opens wss://<this host>/pbx-ws (trusted wildcard
    # certificate) and nginx forwards the SIP WebSocket to Issabel's /ws on the LAN. Media
    # (DTLS-SRTP) flows directly between the browser and the PBX. SIP_WSS_URL points here.
    location = /pbx-ws {
        proxy_pass http://10.10.0.220:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    root /usr/share/nginx/html;

    # `expires`, not add_header: an add_header here would drop the server-level headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
