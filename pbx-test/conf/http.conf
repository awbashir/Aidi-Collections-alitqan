; HTTPS + secure WebSocket for WebRTC agents (wss://pbx-test:8089/ws). TEST ONLY cert.
[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/pbx-test.crt
tlsprivatekey = /etc/asterisk/keys/pbx-test.key
enablestatic = no
enable_status = no
sessionlimit = 100
