# Alitqan site (native install, deploy/native/README.md): TLS, the built SPA, /api/* -> the API on
# loopback with the prefix stripped. Same rules as deploy/nginx/cawp.conf (the Docker variant);
# nginx 1.24 (Ubuntu 24.04) takes http2 on the listen line.
# Certificate: /opt/alitqan/deploy/certs/{fullchain,privkey}.pem (self-signed for 10.10.10.150).

# Port 80 only redirects to HTTPS (a plain-HTTP app was tried on 2026-10-21 and switched off again
# at the customer's request).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /opt/alitqan/deploy/certs/fullchain.pem;
    ssl_certificate_key /opt/alitqan/deploy/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/alitqan-app.inc;
}
