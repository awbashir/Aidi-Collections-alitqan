; CDR: the test PBX writes CSV (cdr_csv) to /var/log/asterisk/cdr-csv/Master.csv (a volume).
; Issabel writes the same records to MySQL asteriskcdrdb.cdr (cdr_mysql / cdr_adaptive_odbc).
[general]
enable = yes
unanswered = yes
congestion = yes
endbeforehexten = no
initiatedseconds = no

; cdr_csv reads its [csv] section from cdr.conf
[csv]
usegmtime = no
loguniqueid = yes
loguserfield = yes
accountlogs = no
