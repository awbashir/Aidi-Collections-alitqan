# CAWP: extension provisioning API for the CAWP app server (10.0.40.6). Added 2026-10-20
# (customer request: create and edit the agents' extensions from the app).
#
# Port 8092, separate from the Issabel UI (80/443) and the recordings server (8091):
#   * every request goes to /var/www/cawp-provision/index.php, which runs ONE operation of the
#     root script /usr/local/sbin/cawp-ext-provision through sudo (/etc/sudoers.d/cawp-ext-provision);
#   * only from 10.0.40.6 AND with the header X-CAWP-Token = the shared secret, defined in the
#     root-only /etc/httpd/cawp/provision-token.conf (`Define CAWP_PROVISION_TOKEN ...`; app side:
#     PBX_PROVISION_TOKEN in CAWP-API/.env.docker). Everything else: 403.
# The access log has no headers (the token is never logged).
# Remove: delete this file, /var/www/cawp-provision, /etc/httpd/cawp/provision-token.conf and
# /etc/sudoers.d/cawp-ext-provision, then `systemctl reload httpd`.
Include /etc/httpd/cawp/provision-token.conf

Listen 8092

<VirtualHost *:8092>
    ServerName cawp-provision
    DocumentRoot "/var/www/cawp-provision"
    ErrorLog "logs/cawp_provision_error_log"
    LogFormat "%a %t \"%m %U\" %>s %B %D" cawp_provision
    CustomLog "logs/cawp_provision_access_log" cawp_provision
    TraceEnable off
    AllowEncodedSlashes Off
    LimitRequestBody 4096

    <Directory "/var/www/cawp-provision">
        Options None
        AllowOverride None
        DirectoryIndex disabled
    </Directory>

    # every path is answered by index.php (it routes /v1/extensions...)
    RewriteEngine On
    RewriteRule "^/v1/extensions(/[0-9]{2,6}(/rename|/secret|/webrtc)?)?$" "/var/www/cawp-provision/index.php" [L]
    RewriteRule "^" "-" [F]

    <Location "/">
        <RequireAll>
            Require ip 10.0.40.6
            Require method GET POST DELETE
            # unquoted: Apache 2.4.6 (CentOS 7 / Issabel 4) reads surrounding quotes as part of the expression
            Require expr req('X-CAWP-Token') == '${CAWP_PROVISION_TOKEN}'
        </RequireAll>
    </Location>

    Header always set Cache-Control "private, no-store"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
