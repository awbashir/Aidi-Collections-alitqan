# CAWP (Aidi Collections) local stack
#   docker compose up -d db redis        # infra only (API/frontend run locally)
#   docker compose up -d                 # infra + API
#   docker compose --profile web up -d   # + frontend dev server
#   docker compose --profile test run --rm api-test   # pytest against a throwaway Postgres (test-db)
services:
  db:
    image: postgres:16-alpine
    container_name: cawp-db
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "101016"
      POSTGRES_DB: mydata
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=100
      - -c
      - jit=off
    ports:
      - "5433:5432"
    volumes:
      - cawp_pgdata:/var/lib/postgresql/data
      - ./dump-mydata-202609151932.sql:/dump/mydata.dump:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydata"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: cawp-redis
    restart: unless-stopped
    # in-memory only: no RDB/AOF persistence, LRU eviction when full
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "768mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./CAWP-API
    container_name: cawp-api
    restart: unless-stopped
    env_file: ./CAWP-API/.env.docker
    ports:
      - "9797:9797"
      - "9798:9798"   # scratch port for testing a second gunicorn (--reload) inside the container
    volumes:
      - ./CAWP-API:/app
      - cawp_uploads:/app/uploads
      - ./db:/db:ro   # migrations: docker exec cawp-api python manage_db.py status|baseline|up
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Reviewed bulk jobs (Phase 2): validation, execution and retention run here, not in the API.
  # Same image, env and upload volume as `api` (uploads and CSV artifacts live under
  # UPLOAD_DIR/private/bulk) and report exports (Phase 4). Needs `python manage_db.py up`.
  # Scale out with `--scale worker=2` (claims use FOR UPDATE SKIP LOCKED; drop container_name first).
  worker:
    build: ./CAWP-API
    container_name: cawp-worker
    restart: unless-stopped
    env_file: ./CAWP-API/.env.docker
    environment:
      BULK_BATCH_SIZE: "500"
      BULK_LEASE_SECONDS: "60"
      BULK_MAX_ATTEMPTS: "3"
      BULK_RETENTION_INTERVAL_SECONDS: "600"
      BULK_WORKER_HEALTH_FILE: /tmp/cawp-worker.alive
    command: ["python", "-m", "worker"]
    stop_signal: SIGTERM
    stop_grace_period: 90s      # the current batch finishes, then the job is released
    volumes:
      - ./CAWP-API:/app
      - cawp_uploads:/app/uploads
    healthcheck:
      # the worker loop touches the file between batches and while idle; the check also pings the DB
      test: ["CMD", "python", "-m", "worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["web"]
    image: node:22-alpine
    container_name: cawp-web
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run start -- --host 0.0.0.0 --port 5177"
    environment:
      VITE_API_URL: http://localhost:9797
    ports:
      - "5177:5177"
    volumes:
      - ./CAWP-frontend:/app
      - cawp_node_modules:/app/node_modules
    depends_on:
      - api

  # --- tests (profile "test"): small, throwaway Postgres; never the 2.2 GB dump -------------
  # docker compose --profile test run --rm api-test          # whole pytest suite
  # docker compose --profile test run --rm api-test tests/test_riyadh.py -k boundary
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: cawp-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # throwaway test instance only
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off",
              "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "jit=off"]
    ports:
      - "5439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-test:
    profiles: ["test"]
    build: ./CAWP-API
    working_dir: /app
    environment:
      # admin connection; the suite creates/drops only databases named cawp_test*
      TEST_DATABASE_URL: postgresql://postgres:postgres@test-db:5432/postgres
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["sh", "-c", "pip install -q --disable-pip-version-check --root-user-action=ignore -r requirements-dev.txt && exec python -m pytest -p no:cacheprovider \"$$@\"", "--"]
    command: ["-q", "tests"]
    volumes:
      - ./CAWP-API:/app
      - ./db:/db:ro
    depends_on:
      test-db:
        condition: service_healthy

  # --- CDR test fixture (profile "cdr-test"): a local MySQL 8 standing in for the Issabel CDR
  # database. The real PBX (10.10.0.220) is never contacted from tests or local development.
  # Schemas asteriskcdrdb.cdr + call_center.{calls,call_recording,agent} and synthetic rows
  # linked to the ZZ-TEST cases and to the pytest fixture: db/cdr-test/init/*.sql (loaded on
  # every start: the data directory is a tmpfs). Read-only user crm / cdr-test-only.
  #   docker compose --profile cdr-test up -d cdr-test-db
  # Tests (the stream R-C call reports reach it through the CDR_TEST_* variables):
  #   docker compose --profile test run --rm -e TEST_DB_PREFIX=cawp_test_repc \
  #       -e CDR_TEST_HOST=cdr-test-db api-test tests/test_reports_v2_c.py tests/test_reports_v2_c_cdr.py
  # Local dev: point cawp-api at it with CDR_HOST=cdr-test-db CDR_USER=crm
  #   CDR_PASSWORD=cdr-test-only CDR_DB=asteriskcdrdb CDR_ENABLED=1 in CAWP-API/.env.docker
  #   (then `docker compose up -d api worker`); from the host it listens on 127.0.0.1:3317.
  cdr-test-db:
    profiles: ["cdr-test"]
    image: mysql:8.0
    container_name: cawp-cdr-test-db
    environment:
      MYSQL_ROOT_PASSWORD: cdr-test-root   # throwaway local fixture only
      TZ: Asia/Riyadh                      # the PBX writes calldate in its local wall clock
    command: ["--skip-name-resolve", "--character-set-server=utf8mb4"]
    ports:
      - "127.0.0.1:3317:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./db/cdr-test/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP ping: the entrypoint's init server runs with --skip-networking, so this only
      # succeeds once the init SQL has been loaded and the real server listens
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcdr-test-root", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  cawp_pgdata:
  cawp_uploads:
  cawp_node_modules:
