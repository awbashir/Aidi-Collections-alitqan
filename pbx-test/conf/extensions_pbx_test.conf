; CAWP test PBX: agent dialing context and the simulated networks (TEST ONLY).

; What an agent endpoint may dial by itself: other test extensions and an echo test.
; It never includes collections-human-outbound (only AMI Originate enters that context).
[cawp-agents]
exten => _7XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
exten => 600,1,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Echo()
exten => _X.,1,Hangup(21)

; Calls arriving from the trunk are refused (no inbound route in the test PBX).
[pbx-test-trunk-inbound]
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)

; Everything on the loopback network (127.0.0.2:5160).
[pbx-test-sim-network]
; Simulated agent phones.
exten => agent-7201,1,Answer()
 same => n,Set(TIMEOUT(absolute)=300)
 same => n,Wait(300)
 same => n,Hangup()
exten => agent-7202,1,Busy(5)
exten => agent-7203,1,Ringing()
 same => n,Wait(300)
 same => n,Hangup()
; Simulated customers: the LAST DIGIT of the dialled number decides the behaviour.
exten => _+X.,1,Goto(pbx-test-customer,${EXTEN:-1},1)
exten => _X.,1,Goto(pbx-test-customer,${EXTEN:-1},1)

[pbx-test-customer]
; ...1  answers, plays a short tone, then echoes the caller (max 120 s)
exten => 1,1,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Playtones(440/300,0/300)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Echo()
; ...2  busy (486)
exten => 2,1,Busy(5)
; ...3  rings and never answers
exten => 3,1,Ringing()
 same => n,Wait(300)
 same => n,Hangup()
; ...4  answers and hangs up after PBX_TEST_SHORT_CALL_SECONDS
exten => 4,1,Answer()
 same => n,Wait(${GLOBAL(PBX_TEST_SHORT_CALL_SECONDS)})
 same => n,Hangup(16)
; ...5  congestion / unreachable
exten => 5,1,Congestion(5)
; ...6  rings for 3 s, then answers with a tone for 20 s
exten => 6,1,Ringing()
 same => n,Wait(3)
 same => n,Answer()
 same => n,Playtones(440)
 same => n,Wait(20)
 same => n,Hangup(16)
; anything else: congestion
exten => _X,1,Congestion(5)
