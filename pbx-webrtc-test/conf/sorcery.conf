; CAWP WebRTC test PBX (TEST ONLY): PJSIP digest credentials come from the application database.
; Lookups try the wizards in order: the realtime row first (pbx_ps_auths: a row only while the
; credential is current, unexpired, owned and the user active), then the "locked" auth objects
; in pjsip.conf, whose HA1 nobody knows, so a missing/expired credential is a clean 401.
; Production (Issabel): the same two lines, with `ps_auths` mapped to res_odbc (or
; res_config_pgsql) in extconfig.conf; see review/phase5-softphone.md §2.4.
[res_pjsip]
auth = realtime,ps_auths
auth = config,pjsip.conf,criteria=type=auth
