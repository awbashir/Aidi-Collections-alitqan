; CAWP WebRTC test PBX dialplan (TEST ONLY).
[general]
static = yes
writeprotect = yes
clearglobalvars = no
autofallthrough = yes

[globals]

[default]
exten => _X.,1,Hangup(21)

; What an agent softphone may dial by itself (the same rule as pbx-test and Issabel's agent
; context): other agent extensions and the echo test. Never a trunk, never an external number.
[cawp-agents]
exten => _7XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
exten => 600,1,Answer()
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Echo()
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)

; TEST ONLY: where the test's AMI Originate sends the agent leg once the softphone answered.
; `echo` stands in for the connected customer: it returns the agent's own audio, so audio must
; flow both ways (browser -> PBX -> browser). `tone` sends a steady 440 Hz tone.
[webrtc-test-answered]
exten => echo,1,Set(TIMEOUT(absolute)=180)
 same => n,Echo()
exten => tone,1,Set(TIMEOUT(absolute)=180)
 same => n,Playtones(440)
 same => n,Wait(175)
 same => n,Hangup()
