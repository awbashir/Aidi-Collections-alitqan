; CAWP test PBX dialplan (TEST ONLY).
[general]
static = yes
writeprotect = yes
clearglobalvars = no
autofallthrough = yes

[globals]
; Written by entrypoint.sh on every start (root-owned, never from channel variables):
;   COLLECTIONS_HUMAN_PBX_EPOCH (new UUID per PBX process), COLLECTIONS_AGI_URL,
;   COLLECTIONS_AGI_KEY, PBX_TEST_SHORT_CALL_SECONDS
#include /run/asterisk/collections-pbx-epoch.conf
#include /run/asterisk/collections-globals.conf

[default]
exten => _X.,1,Hangup(21)

; The generated extension-first contexts (python -m services.calling.dialplan < policy.json).
#include extensions_collections.conf
; Agent contexts and the simulated customer network.
#include extensions_pbx_test.conf
